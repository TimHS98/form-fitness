function gymPicker(){const g=gyms(),recent=[...new Set(sorted().map(s=>s.gymId).filter(Boolean))],f=gymFilter;const filtered=g.filter(x=>(!f.chain||x.chain===f.chain)&&(!f.country||x.country===f.country)&&(!f.region||x.region===f.region)&&(!f.area||x.area===f.area)&&(!f.q||[x.name,x.area,x.region,x.country].join(' ').toLowerCase().includes(f.q.toLowerCase())));const choices=(k,keys)=>[...new Set(g.filter(x=>keys.every(y=>!f[y]||x[y]===f[y])).map(x=>x[k]).filter(Boolean))].sort();return `<details ${gymId?'':'open'}><summary><div><span class="hint">Gym location</span><h3>${esc(gymId?gymName(gymId):'Choose gym')}</h3></div></summary><div class="inside"><div class="inputgrid"><label>Chain<select data-gfilter="chain">${options(choices('chain',[]),f.chain,'All chains')}</select></label><label>Country<select data-gfilter="country">${options(choices('country',['chain']),f.country,'All countries')}</select></label>${f.country==='Singapore'?'':`<label>State<select data-gfilter="region">${options(choices('region',['chain','country']),f.region,'All states')}</select></label>`}<label>Area<select data-gfilter="area">${options(choices('area',['chain','country','region']),f.area,'All areas')}</select></label></div><label>Search outlet<input id="gymSearch" value="${esc(f.q)}" placeholder="Pelangi, AustinGreen…"></label>${btn('Search','gymSearch','','small full ghost')}<label>Outlet<select id="gymSelect">${opt('','Choose outlet',gymId)}${recent.some(id=>filtered.some(g=>g.id===id))?`<optgroup label="Recently visited">${recent.map(id=>filtered.find(g=>g.id===id)).filter(Boolean).map(x=>opt(x.id,x.name+' · '+x.area,gymId)).join('')}</optgroup>`:''}<optgroup label="Other outlets">${filtered.filter(x=>!recent.includes(x.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>opt(x.id,x.name+' · '+x.area,gymId)).join('')}</optgroup>${gymId&&!filtered.some(x=>x.id===gymId)?opt(gymId,gymName(gymId),gymId):''}</select></label><div class="actions" style="margin-top:8px">${btn('+ Add gym','custo function exPicker(){const day=state.days.find(d=>d.id===selectedDay),f=filter,historyIds=new Set(sorted().flatMap(s=>s.exercises.map(e=>e.catalogId))),fav=state.favorites||[];const allowed=selectedDay==='freestyle'?groups:cats[day?.name]||groups;const list=catalog().filter(c=>(!f.equipment||c.equipment===f.equipment)&&(!f.muscle||c.muscle===f.muscle)&&(!f.q||[c.name,c.equipment,c.muscle].join(' ').toLowerCase().includes(f.q.toLowerCase()))&&(f.muscle||f.q||f.equipment||addContext==='active'||allowed.includes(c.muscle)));const item=c=>`<div class="line row"><div style="flex:1"><h3>${esc(c.name)}</h3><span class="hint">${esc(c.equipment)} · ${esc(c.muscle)}</span></div>${btn(fav.includes(c.id)?'★':'☆','favorite',`data-id="${esc(c.id)}" aria-label="Favourite"`,'small ghost')}${btn('Add','selectEx',`data-id="${esc(c.id)}"`,'small')}</div>`;const prev=list.filter(c=>historyIds.has(c.id)||fav.includes(c.id)),rest=list.filter(c=>!historyIds.has(c.id)&&!fav.includes(c.id));return `<div class="panel" id="exercisePicker"><div class="row"><h2>Exercise library</h2>${btn('Close','closePicker','','small ghost')}</div><div class="inputgrid"><label>Equipment<select data-efilter="equipment">${options(equipment,f.equipment,'All equipment')}</select></label><label>Muscle<select data-efilter="muscle">${options(groups,f.muscle,'All muscles')}</select></label></div><label>Search<input id="exSearch" value="${esc(f.q)}" placeholder="Incline press, cable…"></label><div class="actions">${btn('Search','exSearch','','small ghost')}${btn('+ Custom exercise','customEx','','small ghost')}</div><p class="eyebrow" style="margin-top:16px">Previously performed & favourites</p>${prev.map(item).join('')||'<p class="hint">None yet in this selection.</p>'}<details open><summary>Other exercises <span class="pill">${rest.length}</span></summary><div class="inside">${rest.map(item).join('')||'<p class="hint">No matching exercises.</p>'}</div></details><p class="hint">Clear filters to see category suggestion function setHtml(e,r,j,p){const base=`data-ex="${esc(e.id)}" data-row="${esc(r.id)}"`,old=p?work(p.e)[j]:null;return `<div class="setgrid setrow ${r.done?'complete':''}"><span class="hint">${j+1}</span><span class="hint">${old?old.kg+'×'+old.reps:'—'}</span><input aria-label="Set ${j+1} weight" type="number" min="0" max="2000" step="any" inputmode="decimal" data-field="kg" ${base} value="${r.kg??''}" placeholder="—"><input aria-label="Set ${j+1} reps" type="number" min="1" max="1000" step="1" inputmode="numeric" data-field="reps" ${base} value="${r.reps??''}" placeholder="—">${btn('−','removeSet',base+' aria-label="Remove set"','small ghost')}</div>`}

function history(){return top('TRAINING RECORD','History','Completed working sets. Legacy records remain preserved.')+(sorted().map(s=>`<details><summary><div><h3>${esc(s.name)}</h3><span class="hint">${dateText(s.finished)} · ${esc(s.gymName||gymName(s.gymId))} · ${s.exercises.reduce((n,e)=>n+work(e).length,0)} sets</span></div></summary><div class="inside">${s.exercises.filter(e=>work(e).length).map(e=>`<div class="line"><h3>${esc(e.name)}</h3><span class="hint">${esc(e.equipment||'Legacy')} · ${esc(e.machineName||'Unspecified equipment')} · ${esc(e.basis||'')}</span>${work(e).map(r=>`<div class="row"><span>Working set</span><span>${r.kg} ${esc(e.unit||'kg')} × ${r.reps}</span></div>`).join('')}</div>`).join('')}<div class="actions">${btn('Correct workout','editSession',`data-id="${esc(s.id)}" ${state.active?'disabled':''}`,'small ghost')}${btn('Delete','deleteSession',`data-id="${esc(s.id)}"`,'small danger ghost')}</div></div></details>`).join('')||'<div class="empty">No workouts yet.</div>')}
function progress(){const all=new Map();for(const s of sorted())for(const e of s.exercises)if(work(e).length&&!all.has(key(e)))all.set(key(e),e);const id=all.has(progressId)?progressId:all.keys().next().value;let html=top('PERFORMANCE','Progress','Only compare the same exercise, gym, machine and weight convention.');if(id){const e=all.get(id),data=sorted().flatMap(s=>s.exercises.filter(x=>key(x)===id&&work(x).length).map(x=>({s,r:work(x)}))).slice(0,12).reverse(),max=Math.max(1,...data.flatMap(d=>d.r.map(r=>r.kg))),px=i=>32+i*270/Math.max(1,data.length-1),py=v=>118-v/max*90;html+=`<div class="panel"><label>Exercise / equipment<select id="progressSelect">${[...all].map(([k,v])=>opt(k,v.name+' · '+(v.equipment||'Legacy')+' · '+gymName(v.gymId)+' · '+(v.machineName||'Unspecified'),id)).join('')}</select></label><h2 style="margin-top:12px">Top working load (${esc(e.unit||'kg')})</h2><svg class="chart" viewBox="0 0 320 148"><path d="M32 28V118H307" fill="none" stroke="#444"/>${[0,.5,1].map(f=>`<line x1="32" x2="307" y1="${py(max*f)}" y2="${py(max*f)}" stroke="#333"/><text x="28" y="${py(max*f)+4}" text-anchor="end" fill="#a0a4a2" font-size="9">${Math.round(max*f*10)/10}</text>`).join('')}<polyline points="${data.map((d,i)=>`${px(i)},${py(Math.max(...d.r.map(r=>r.kg)))}`).join(' ')}" fill="none" stroke="#b8dfbc" stroke-width="2"/>${data.map((d,i)=>`<circle cx="${px(i)}" cy="${py(Math.max(...d.r.map(r=>r.kg)))}" r="3.5" fill="#b8dfbc"/>`).join('')}</svg><p class="hint">Load alone is not proof of progress; compare reps and technique.</p>${data.reverse().map(d=>`<div class="line"><strong>${dateText(d.s.finished)}</strong><div class="hint">${esc(d.r.map(r=>r.kg+'×'+r.reps).join(' · '))}</div></div>`).join('')}</div>`}else html+='<div class="empty">Log a workout to see progress.</div>';const counts=Object.fromEntries(groups.map(g=>[g,0]));for(const s of state.sessions.filter(s=>Date.parse(s.finished)>=Date.now()-7*864e5))for(const e of s.exercises)counts[e.muscle]+=work(e).len app.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset.field)return;const {e,r}=locate(el.dataset);if(!r||r.warm)return;let v=num(el.value),k=el.dataset.field;if(v!==null&&(!finite(v)||v<0||k==='reps'&&(!Number.isInteger(v)||v>1000)||k==='kg'&&v>2000))v=null;r[k]=v;r.done=finite(r.kg)&&r.kg>=0&&Number.isInteger(r.reps)&&r.reps>0;el.closest('.setrow').classList.toggle('complete',r.done);if((k==='kg'||r.done)&&finite(r.kg)){const next=allWork(e).slice(allWork(e).indexOf(r)+1).find(x=>!x.done&&x.reps===null);if(next){next.kg=r.kg;const inp=[...app.querySelectorAll('input[data-field="kg"]')].find(x=>x.dataset.row===next.id);if(inp)inp.value=r.kg}}refreshCounts();save()});

function showCloud(){cloudPanel.classList.remove('hidden');cloudPanel.innerHTML=`<div class="row"><h2>Google Drive</h2><button class="small ghost" id="closeCloud">Close</button></div><p class="hint">${account?esc(account.email||account.name||'Connected Google account'):'Your workouts stay on this device until you connect.'}</p><p class="hint">FORM. v${RELEASE} · ${profile.dirty?'Local changes pending':'No pending local changes'}</p>${problem?`<p class="notice">${esc(problem)}</p>`:''}${conflict?'<p class="notice">Two versions of your data exist. Both are retained. Reconnect or contact support before choosing a version; automatic uploads are paused.</p>':''}<div class="stack"><button id="connectCloud" class="primary">${account?'Reconnect Google account':'Connect Google Drive'}</button>${account?'<button id="syncCloud">Sync now</button><button id="switchCloud" class="ghost">Switch account</button><button id="disconnectCloud" class="ghost">Sign out on this device</button>':''}${conflict?'<button id="keepLocal">Resolve: keep this device version</button><button id="keepRemote">Resolve: use latest cloud version</button>':''}</div><p class="hint" style="margin-top:12px">Automatic cloud snapshots; no routine export needed. Reconnect when Google access expires. Each Google account has independent records.</p>`;
 document.getElementById('closeCloud').onclick=()=>cloudPanel.classList.add('hidden');document.getElementById('connectCloud').onclick=()=>connect(false);if(account){document.getElementById('syncCloud').onclick=()=>tokenOK()?sync():connect(false);document.getElementById('switchCloud').onclick=()=>connect(true);document.getElementById('disconnectCloud').onclick=disconnect}if(conflict){document.getElementById('keepLocal').onclick=()=>resolveConflict(false);document.getElementById('keepRemote').onclick=()=>resolveConflict(true)}}

function fail(e){problem=e?.message||String(e);paintCloud();if(!cloudPanel.classList.contains('hidden'))showCloud()}
async function api(url,opts={}){if(!tokenOK())throw Error('Google access expired. Reconnect to upload pending changes.');const r=await fetch(url,{...opts,headers:{...opts.headers,Authorization:'Bearer '+accessToken}});if(r.status===401){accessToken=null;throw Error('Google access expired. Reconnect to upload pending changes.')}if(!r.ok)throw Error('Google Drive request failed ('+r.status+'). Your local records have not been discarded.');return r.json()}
function connect(switching){if(busy||connecting)return;if(!navigator.onLine){fail(Error('Connect to the internet first.'));return}if(!globalThis.google?.accounts?.oauth2){fail(Error('Google sign-in is unavailable. Open the hosted HTTPS app and allow Google sign-in in your browser.'));return}if(loadFailed){fail(Error('Existing device data cannot be read. Do not overwrite it.'));return}if(switching&&profile.dirty&&!confirm('This account has unsynced changes. They will remain on this device. Switch accounts anyway?'))return;connecting=true;lockUI(true);problem='';const priorToken=accessToken,priorExpiry=expiresAt;const release=()=>{connecting=false;lockUI(false);paintCloud()};try{const c=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,include_granted_scopes:false,callback:async response=>{try{if(response.error||!response.access_token)throw Error(response.error||'Google did not grant access');accessToken=response.access_token;expiresAt=Date.now()+Number(response.expires_in||3600)*1000;const info=await api(DRIVE+'/about?fields=user(permissionId,emailAddress,displayName)');const u=info.user;if(!u?.permissionId)throw Error('Could not identify your Google Drive account.');const next={id:u.permissionId,email:u.emailAddress||'',name:u.displayName||''};if(account?.id!==next.id){const raw=localStorage.getItem(PROFILE_PREFIX+next.id);let nextState=fresh(),nextProfile={base:null,dirty:false};if(raw){const x=JSON.parse(raw);nextState=migrateState(x.state);nextProfile={base:x.base||null,dirty:!!x.dirty}}else if(!account&&(state.sessions.length||state.active)&&confirm('Use this device’s existing guest workouts for this Google account? Choose Cancel for a separate profile.')){nextState=copy(state);nextProfile.dirty=true}localStorage.setItem(ACCOUNT_KEY,JSON.stringify(next));account=next;state=nextState;profile=nextProfile;conflict=null;persist();resetView()}else {account=next;localStorage.setItem(ACCOUNT_KEY,JSON.stringify(next))}problem='';release();showCloud function disconnect(){if(busy||connecting)return;if(profile.dirty&&!confirm('Pending records will remain on this device under your account. Sign out anyway?'))return;accessToken=null;expiresAt=0;account=null;profile={base:null,dirty:false};problem='';conflict=null;localStorage.removeItem(ACCOUNT_KEY);try{const raw=localStorage.getItem(KEY);state=raw?migrateState(JSON.parse(raw)):fresh()}catch(e){loadFailed=true;state=fresh()}persist();resetView();showCloud()}
function scheduleSync(){clearTimeout(syncTimer);if(tokenOK()&&!conflict&&navigator.onLine)syncTimer=setTimeout(()=>sync(),1800)}
async function snapshots(){let all=[],page='';do{const q=new URLSearchParams({q:"trashed = false and appProperties has { key='formKind' and value='snapshot' }",fields:'nextPageToken,files(id,name,createdTime,appProperties)',pageSize:'1000'});if(page)q.set('pageToken',page);const r=await api(DRIVE+'/files?'+q);all.push(...(r.files||[]));page=r.nextPageToken||''}while(page);const byId=new Map();for(const f of all){const id=f.appProperties?.snapshot;if(id)byId.set(id,f)}const parents=new Set();for(const f of byId.values())for(const [k,v] of Object.entries(f.appProperties||{}))if(/^p\d+$/.test(k))parents.add(v);return [...byId.values()].filter(f=>!parents.has(f.appProperties.snapshot)).sort((a,b)=>String(b.createdTime).localeCompare(String(a.createdTime)))}
async function readSnapshot(f){const data=await api(DRIVE+'/files/'+encodeURIComponent(f.id)+'?alt=media');if(data.snapshot!==f.appProperties.snapshot||data.format!==1)throw Error('Cloud data format not supported. No records overwritten.');return migrateState(data.state)}
async function snapshotFolder(){const q=new URLSearchParams({q:"trashed = false and mimeType = 'application/vnd.google-apps.folder' and appProperties has { key='formKind' and value='folder' }",fields:'files(id)',pageSize:'100'});const r=await api(DRIVE+'/files?'+q);if(r.files?.length)return r.files[0].id;const folder=await api(DRIVE+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'FORM Fitness',mimeType:'application/vnd.google-apps.folder',appProperties:{formKind:'folder'}})});return folder.id}
async function writeSnapshot(data,parents){if(parents.length>20)throw Error('Too many conflicting versions; recovery is required.');const id=uid(),props={formKind:'snapshot',snapshot:id};parents.forEach((v,i)=>props['p'+i]=v);const boundary='form_'+uid().replace(/[^a-zA-Z0-9]/g,'');const folder=await snapshotFolder();const meta={parents:[folder],name:'FORM snapshot '+now().replace(/[:.]/g,'-')+' '+id.slice(0,8)+'.json',mimeType:'application/json',appProperties:props};const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({format:1,snapshot:id,appVersion:RELEASE,savedAt:now(),state:data})+'\r\n--'+boundary+'--';await api(UPLOAD+'/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});return id}
async function sync(){if(staleTab||!account||busy||connecting||loadFailed||!tokenOK()||!navigator.onLine||conflict){paintCloud();return}busy=true;paintCloud();const initial=JSON.stringify(state);try{const heads=await snapshots(),head=heads[0],remote=head?.appProperties.snapshot||null;if(heads.length>1||(remote!==profile.base&&profile.dirty&&remote!==null)){conflict=heads;throw Error('Cloud and device versions differ. Both versions are preserved; choose a version in Google Drive settings.')}if(remote!==profile.base){if(!head)throw Error('Cloud snapshots are missing. Local data retained; reconnect after checking Drive.');const incoming=await readSnapshot(head);if(initial!==JSON.stringify(state)){conflict=heads;throw Error('A remote version arrived during local editing. Resolve the conflict before uploading.')}state=incoming;profile={base:remote,dirty:false};persist();resetView()}else if(profile.dirty||!remote){const sent=copy(state),text=JSON.stringify(sent);const id=await writeSnapshot(sent,remote?[remote]:[]);profile.base=id;profile.dirty=JSON.stringify(state)!==text;persist()}problem=''}catch(e){fail(e)}finally{busy=false;paintCloud();if(!cloudPanel.classList.contains('hidden'))showCloud();if(profile.dirty&&!problem)scheduleSync()}}
async function resolveConflict(useRemote){if(busy||!tokenOK()){toast('Reconnect Google first');return}if(!confirm(useRemote?'Use the latest cloud version? Other cloud versions remain as recovery snapshots. Local changes will also be archived.':'Keep this device version? Other cloud versions remain as recovery snapshots.'))return;busy=true;lockUI(true);try{const heads=await snapshots(),ids=heads.map(f=>f.appProperties.snapshot);if(!heads.length)throw Error('No cloud versions found');const local=copy(state);const chosen=useRemote?await readSnapshot(heads[0]):local;if(useRemote&&profile.dirty){const archived=await writeSnapshot(local,profile.base?[profile.base]:[]);ids.push(archived)}const id=await writeSnapshot(chosen,[...new Set(ids)]);state=chosen;profile={base:id,dirty:false};conflict=null;problem='';persist();resetView()}catch(e){fail(e)}finally{busy=false;lockUI(false);paintCloud();showCloud()}}
