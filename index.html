<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101112"><meta name="color-scheme" content="dark"><title>FORM. — Training log</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#191b1c;--line:#2c2f30;--ink:#f2f3ef;--muted:#a0a4a2;--accent:#b8dfbc;--bad:#f0b4a8;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button,input,select,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;min-height:44px;padding:10px 14px;font-weight:600}button.primary{background:var(--accent);color:#142117;border-color:var(--accent)}button.ghost{background:transparent}button.danger{color:var(--bad)}button.small{font-size:13px;min-height:38px;padding:7px 11px}.shell{max-width:680px;margin:auto;padding:24px 18px 108px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-size:26px;letter-spacing:-1.9px;font-weight:850;line-height:1}.brand span{color:var(--accent)}.tag,.muted,.hint{color:var(--muted)}.tag{font-size:10px;letter-spacing:1.8px;font-weight:650;margin-top:6px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:650;margin:0 0 7px}h1{font-size:32px;letter-spacing:-1.2px;line-height:1.14;margin:0 0 8px}h2{font-size:20px;letter-spacing:-.4px;margin:0 0 10px}h3{font-size:16px;margin:0}p{margin:0 0 12px}.hint{font-size:12px}.section{margin:24px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.full{width:100%}.metricgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:14px;padding:13px}.metric strong{display:block;font-size:25px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:12px}.line{border-top:1px solid var(--line);padding:14px 0}.line:first-child{border-top:0}.pill{display:inline-block;border:1px solid var(--line);border-radius:100px;padding:4px 9px;font-size:11px;white-space:nowrap;color:var(--muted)}.accent{color:var(--accent)}.warn{color:var(--bad)}.progress{height:4px;background:var(--line);border-radius:10px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:var(--accent)}.nav{position:fixed;bottom:0;left:0;right:0;background:#141617;border-top:1px solid var(--line);z-index:5;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.nav-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{display:grid;justify-items:center;gap:3px;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:500;min-height:54px;padding:5px}.nav button.active{color:var(--accent)}.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.inputgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--muted)}input,select{width:100%;min-width:0;background:#111314;border:1px solid var(--line);border-radius:9px;color:var(--ink);min-height:44px;padding:8px 10px;margin-top:4px}input[type=number]{appearance:textfield;-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{appearance:none;margin:0}.setgrid{display:grid;grid-template-columns:27px minmax(0,1.05fr) minmax(0,.85fr) minmax(0,.8fr) 43px;gap:6px;align-items:center}.setgrid.head{color:var(--muted);font-size:11px;margin:12px 0 5px}.setgrid input,.setgrid select{margin:0;padding:7px 5px;text-align:center;font-variant-numeric:tabular-nums}.setgrid select{padding:6px 2px}.setgrid .tick{min-height:44px;padding:0;font-size:20px}.setgrid.complete .tick{color:#142117;background:var(--accent);border-color:var(--accent)}.setgrid.complete input,.setgrid.complete select{border-color:#4b6450}.setrow{margin-bottom:6px}.previous{font-size:12px;color:var(--muted);margin:0 0 10px}.timer{position:sticky;top:8px;z-index:4;background:#222925;border:1px solid #425a47;border-radius:12px;padding:8px 12px;margin:12px 0;display:flex;align-items:center;gap:12px}.timer strong{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}.timer .muted{font-size:11px}.timer button{min-height:36px;padding:5px 10px}.timer .grow{flex:1}.empty{padding:28px 12px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}details{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--panel)}summary{cursor:pointer;padding:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}summary:after{content:'+';color:var(--muted);font-size:19px}details[open]>summary:after{content:'−'}details .inside{padding:0 14px 14px}.toast{position:fixed;z-index:10;bottom:85px;left:50%;transform:translateX(-50%);background:#303a32;color:#e6f5e8;border:1px solid #526a56;border-radius:12px;max-width:90vw;width:max-content;padding:12px 16px;box-shadow:0 5px 20px #0008}.hidden{display:none!important}.bar{height:6px;background:var(--line);border-radius:8px;overflow:hidden;margin:7px 0 12px}.bar i{display:block;height:100%;background:var(--accent)}.chart{width:100%;height:auto;display:block}.notice{padding:12px;border:1px solid #78574e;border-radius:12px;color:var(--bad);margin:10px 0;font-size:13px}.spacer{height:8px}hr{border:0;border-top:1px solid var(--line);margin:16px 0}a{color:var(--accent)}@media(min-width:550px){.shell{padding:36px 28px 110px}.panel{padding:20px}.setgrid{gap:12px}}@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.985)}}
</style></head><body><div class="shell"><header><div><div class="brand">FORM<span>.</span></div><div class="tag">PERSONAL TRAINING JOURNAL</div></div><div style="text-align:right"><button id="cloudButton" class="small ghost">Connect Google Drive</button><div id="saveStatus" class="hint" aria-live="polite">On device</div></div></header><div id="storageWarning" class="notice hidden">Device storage is unavailable. Your records are only in this page's memory. Reconnect before leaving.</div><div id="cloudPanel" class="panel hidden"></div><div id="updatePanel" class="notice hidden">A new version is ready. <button id="updateButton" class="small">Update</button></div><main id="app"></main></div><nav class="nav" aria-label="Main navigation"><div class="nav-inner" id="nav"></div></nav><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept=".json,application/json" class="hidden">
<script>
(()=>{
'use strict';
const KEY='form.training.v1';const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>x===''||x==null?null:Number(x);const finite=x=>typeof x==='number'&&Number.isFinite(x);const dateText=x=>new Date(x).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});const now=()=>new Date().toISOString();const copy=x=>JSON.parse(JSON.stringify(x));const groups=['Chest','Back','Shoulders','Biceps','Triceps','Quadriceps','Hamstrings','Glutes','Calves','Core','Other'];
function exercise(name,muscle,low=8,high=12,rest=150,warmups=0,step=2.5){return {id:uid(),name,muscle,sets:5,low,high,rir:2,rest,warmups,step}}
function fresh(){return {version:1,days:[{id:uid(),name:'Push',exercises:[exercise('Incline chest press','Chest',8,12,150,2),exercise('Shoulder press','Shoulders',8,12,150,1),exercise('Cable triceps extension','Triceps',10,15,90,0)]},{id:uid(),name:'Pull',exercises:[exercise('Lat pulldown','Back',8,12,150,2),exercise('Chest-supported row','Back',8,12,150,1),exercise('Cable curl','Biceps',10,15,90,0)]},{id:uid(),name:'Legs',exercises:[exercise('Leg press','Quadriceps',8,12,180,2,5),exercise('Seated leg curl','Hamstrings',10,15,120,1),exercise('Calf raise','Calves',10,15,90,0)]}],sessions:[],active:null,timer:null,lastDay:null}}
const ACCOUNT_KEY='form.account.v1', PROFILE_PREFIX='form.profile.v1.';const RELEASE='1.1.0';
let account=null, profile={base:null,dirty:false},state=fresh(),storageOK=true,loadFailed=false;
function migrateState(raw){if(raw?.version!==1||!validState(raw))throw Error('Unsupported or damaged training data. Nothing was overwritten.');return raw}
try{account=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||'null');const raw=localStorage.getItem(account?PROFILE_PREFIX+account.id:KEY);if(raw){const parsed=JSON.parse(raw);if(account){state=migrateState(parsed.state);profile={base:parsed.base||null,dirty:!!parsed.dirty}}else state=migrateState(parsed)}}catch(e){storageOK=false;loadFailed=true;}
let tab='Today',selectedDay=state.days[(state.days.findIndex(d=>d.id===state.lastDay)+1)%state.days.length]?.id,openEx=null,progressId=null,toastHandle;
const app=document.getElementById('app');const status=document.getElementById('saveStatus');const warning=document.getElementById('storageWarning');
let persisted=JSON.stringify(state);
function persist(){try{if(loadFailed)throw Error('Existing data could not be loaded');if(account)localStorage.setItem(PROFILE_PREFIX+account.id,JSON.stringify({state,...profile}));else localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;warning.classList.add('hidden');persisted=JSON.stringify(state)}catch(e){storageOK=false;warning.classList.remove('hidden');warning.textContent='Device storage unavailable or damaged. Keep this page open and reconnect; changes may not survive closing it.'}paintCloud()}
function save(){if(account&&JSON.stringify(state)!==persisted)profile.dirty=true;persist();if(account&&profile.dirty)scheduleSync()}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.add('hidden'),2600)}
function validExercise(e){return e&&typeof e.id==='string'&&typeof e.name==='string'&&e.name.trim()&&groups.includes(e.muscle)&&Number.isInteger(e.sets)&&e.sets>=1&&e.sets<=12&&Number.isInteger(e.low)&&e.low>=1&&Number.isInteger(e.high)&&e.high>=e.low&&e.high<=100&&Number.isInteger(e.rir)&&e.rir>=0&&e.rir<=5&&Number.isInteger(e.rest)&&e.rest>=15&&e.rest<=900&&Number.isInteger(e.warmups)&&e.warmups>=0&&e.warmups<=5&&finite(e.step)&&e.step>0&&e.step<=100}
function validSet(s){return s&&typeof s.id==='string'&&typeof s.warm==='boolean'&&typeof s.done==='boolean'&&[s.kg,s.reps,s.rir].every(v=>v===null||finite(v))&&(s.kg===null||s.kg>=0)&&(s.reps===null||Number.isInteger(s.reps)&&s.reps>=0&&s.reps<=1000)&&(s.rir===null||Number.isInteger(s.rir)&&s.rir>=0&&s.rir<=5)&&(!s.done||(s.kg!==null&&s.reps>0&&(s.warm||s.rir!==null)))}
function validSession(s){return s&&typeof s.id==='string'&&typeof s.dayId==='string'&&typeof s.name==='string'&&Number.isFinite(Date.parse(s.started))&&(s.finished===null||Number.isFinite(Date.parse(s.finished)))&&Array.isArray(s.exercises)&&s.exercises.every(e=>validExercise(e)&&Array.isArray(e.rows)&&e.rows.every(validSet))}
function validState(s){return s?.version===1&&Array.isArray(s.days)&&s.days.length>0&&s.days.every(d=>typeof d.id==='string'&&typeof d.name==='string'&&d.name.trim()&&Array.isArray(d.exercises)&&d.exercises.every(validExercise))&&Array.isArray(s.sessions)&&s.sessions.every(x=>validSession(x)&&x.finished!==null)&&(s.active===null||validSession(s.active))&&(s.timer===null||(s.timer&&finite(s.timer.end)&&typeof s.timer.name==='string'))}
const work=e=>e.rows.filter(r=>!r.warm&&r.done);const allWork=e=>e.rows.filter(r=>!r.warm);const sorted=()=>[...state.sessions].sort((a,b)=>Date.parse(b.finished)-Date.parse(a.finished));
function previous(ex,exclude){for(const s of sorted()){if(s.id===exclude)continue;const found=s.exercises.find(e=>e.id===ex.id);if(found&&work(found).length)return {e:found,s}}return null}
function sameConfig(a,b){return a.sets===b.sets&&a.low===b.low&&a.high===b.high&&a.rir===b.rir}
function recommend(ex,prior){if(!prior)return {type:'new',title:'Establish a baseline',desc:`Choose a manageable load for ${ex.low}–${ex.high} reps at about ${ex.rir} RIR.`,weights:Array(ex.sets).fill(null)};const old=prior.e,r=work(old),w=allWork(old);const weights=Array.from({length:ex.sets},(_,i)=>w[i]?.done?w[i].kg:r.at(-1)?.kg??null);const uniform=r.every(s=>s.kg===r[0].kg);const comparable=sameConfig(ex,old)&&r.length===ex.sets&&allWork(old).length===ex.sets;const ready=comparable&&uniform&&r.every(s=>s.reps>=ex.high&&s.rir>=ex.rir);if(ready){const next=Math.round((r[0].kg+ex.step)*1000)/1000;return {type:'up',title:`Try ${next} kg`,desc:`All ${ex.sets} sets reached ${ex.high} reps at the target effort or easier. Use the next available increment if suitable.`,weights:Array(ex.sets).fill(next)}}if(!comparable)return {type:'hold',title:'Re-establish comparable sets',desc:'The target or completed set count changed. Use the previous load as a reference.',weights};if(!uniform)return {type:'hold',title:'Hold the set-by-set loads',desc:'Mixed loads are not directly comparable. Repeat or standardise the load before increasing.',weights};if(r.some(s=>s.reps<ex.low))return {type:'review',title:'Review load and recovery',desc:'A set fell below the rep range. Repeat if appropriate or choose a lighter load if technique or fatigue requires it.',weights};return {type:'hold',title:`Hold ${r[0].kg} kg`,desc:`Aim for ${ex.high} reps on every working set at about ${ex.rir} RIR before adding load.`,weights}}
function rowSet(warm,kg=null){return {id:uid(),warm,kg,reps:null,rir:null,done:false}}
function makeSession(d){return {id:uid(),dayId:d.id,name:d.name,started:now(),finished:null,exercises:d.exercises.map(e=>{const rec=recommend(e,previous(e));return {...copy(e),rows:[...Array.from({length:e.warmups},()=>rowSet(true)),...rec.weights.map(kg=>rowSet(false,kg))]}})}}
const icons={Today:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',Progress:'<path d="M3 3v18h18M7 15l4-5 4 3 6-8"/>',History:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',Program:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="#141617"/><circle cx="15" cy="12" r="2" fill="#141617"/><circle cx="9" cy="17" r="2" fill="#141617"/>'};
function btn(text,act,extra='',cls=''){return `<button class="${cls}" data-act="${act}" ${extra}>${text}</button>`}
function render(){document.getElementById('nav').innerHTML=Object.keys(icons).map(t=>`<button data-act="tab" data-id="${t}" class="${tab===t?'active':''}" ${tab===t?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[t]}</svg>${t}</button>`).join('');app.innerHTML=tab==='Today'?today():tab==='Program'?program():tab==='History'?history():progress();updateTimer();if(!storageOK)warning.classList.remove('hidden')}
function top(k,h,p){return `<p class="eyebrow">${k}</p><h1>${h}</h1><p class="muted">${p}</p>`}
function today(){if(state.active)return active();const d=state.days.find(d=>d.id===selectedDay)||state.days[0];const last=sorted()[0];const count=state.sessions.filter(s=>Date.parse(s.finished)>=Date.now()-7*864e5).length;return top('TRAINING JOURNAL','Today','Focus on one better set at a time.')+`<div class="metricgrid section"><div class="metric"><span>Sessions · last 7 days</span><strong>${count}</strong></div><div class="metric"><span>Last workout</span><strong style="font-size:19px">${last?esc(last.name):'—'}</strong><span>${last?dateText(last.finished):'No sessions yet'}</span></div></div><div class="row"><h2>Choose workout</h2><span class="pill">Build · kg</span></div><div class="actions">${state.days.map(x=>btn(esc(x.name),'choose',`data-id="${esc(x.id)}"`,x.id===d.id?'primary':'ghost')).join('')}</div><div class="panel"><div class="row"><h2>${esc(d.name)}</h2><span class="muted">${d.exercises.reduce((a,e)=>a+e.sets,0)} sets</span></div>${d.exercises.map(e=>{const p=previous(e),rec=recommend(e,p);return `<div class="line"><h3>${esc(e.name)}</h3><div class="hint">${e.sets} × ${e.low}–${e.high} · RIR ${e.rir}</div><div class="${rec.type==='up'?'accent':'muted'}" style="font-size:13px;margin-top:4px">${esc(rec.title)}</div></div>`}).join('')||'<p class="muted">Add exercises in Program first.</p>'}${btn('Start workout','start',`data-id="${esc(d.id)}" ${d.exercises.length?'':'disabled'}`,'primary full')}</div><p class="hint">The routine is a starting template. Train on your available days, rest as needed, and edit the programme anytime.</p>`}
function active(){const s=state.active;const total=s.exercises.reduce((a,e)=>a+allWork(e).length,0),done=s.exercises.reduce((a,e)=>a+work(e).length,0);return top('IN SESSION',esc(s.name),dateText(s.started)+' · Working sets')+`<div class="row"><span class="muted">${done} of ${total} completed</span><span class="pill">Auto-save</span></div><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div><div id="timer" class="timer hidden"><div class="grow"><div class="muted" id="timerName">REST</div><strong id="timerValue">02:30</strong></div>${btn('+30s','timerAdd','','small ghost')}${btn('Skip','timerStop','','small ghost')}</div>${s.exercises.map((e,i)=>{const p=previous(e,s.id),r=recommend(e,p),completed=work(e).length;return `<details data-ex="${esc(e.id)}" ${(openEx===e.id||openEx===null&&i===0)?'open':''}><summary><div><h3>${esc(e.name)}</h3><div class="hint">${e.low}–${e.high} reps · RIR ${e.rir} · ${Math.floor(e.rest/60)}m ${e.rest%60}s rest</div></div><span class="pill ${completed===allWork(e).length?'accent':''}">${completed}/${allWork(e).length}</span></summary><div class="inside"><div class="previous">Last: ${p?esc(work(p.e).map(x=>`${x.kg}×${x.reps} @${x.rir===5?'5+':x.rir}`).join(' · ')):'No history'}</div><div class="${r.type==='up'?'accent':'muted'}" style="font-size:13px"><strong>${esc(r.title)}</strong><br>${esc(r.desc)}</div><div class="setgrid head"><span>Set</span><span>kg</span><span>Reps</span><span>RIR</span><span>Done</span></div>${e.rows.map((x,j)=>setHtml(e,x,j)).join('')}<div class="actions" style="margin-top:12px">${btn('+ Warm-up','addWarm',`data-ex="${esc(e.id)}"`,'small ghost')}${btn('+ Set','addSet',`data-ex="${esc(e.id)}"`,'small ghost')}${btn('Rest timer','manualTimer',`data-ex="${esc(e.id)}"`,'small ghost')}</div><p class="hint" style="margin-top:10px">W = warm-up. RIR is actual reps left; 0 = failure, 2 = about two left.</p></div></details>`}).join('')}<div class="section stack">${btn('Finish workout','finish','','primary full')}${btn('Discard workout','discard','','ghost danger full')}</div>`}
function setHtml(e,s,j){const n=e.rows.slice(0,j+1).filter(x=>x.warm===s.warm).length;const base=`data-ex="${esc(e.id)}" data-row="${esc(s.id)}"`;return `<div class="setgrid setrow ${s.done?'complete':''}"><span class="hint">${s.warm?'W':''}${n}</span><input aria-label="${s.warm?'Warm-up':'Set'} ${n} weight" type="number" min="0" max="2000" step="any" inputmode="decimal" data-field="kg" ${base} value="${s.kg??''}" placeholder="—"><input aria-label="${s.warm?'Warm-up':'Set'} ${n} reps" type="number" min="0" max="1000" step="1" inputmode="numeric" data-field="reps" ${base} value="${s.reps??''}" placeholder="—">${s.warm?'<span class="hint" style="text-align:center">—</span>':`<select aria-label="Set ${n} RIR" data-field="rir" ${base}><option value="" ${s.rir===null?'selected':''}>—</option>${[0,1,2,3,4,5].map(x=>`<option value="${x}" ${s.rir===x?'selected':''}>${x===5?'5+':x}</option>`).join('')}</select>`}${btn(s.done?'✓':'○','toggleSet',base+` aria-label="${s.done?'Uncomplete':'Complete'} ${s.warm?'warm-up':'set'} ${n}"`,'tick')}</div>`}
function program(){return top('YOUR ROUTINE','Program','Edit targets and exercises. Past workouts retain their original settings.')+`<p class="hint">Default: rotating Push / Pull / Legs, five working sets per movement, RIR 2. This is editable and not a fixed weekly prescription.</p>${state.days.map(d=>`<details data-day="${esc(d.id)}"><summary><div><h3>${esc(d.name)}</h3><span class="hint">${d.exercises.length} exercises</span></div></summary><div class="inside"><label>Workout name<input data-pday="${esc(d.id)}" data-key="name" value="${esc(d.name)}" maxlength="60"></label>${d.exercises.map((e,i)=>`<div class="panel"><div class="row"><h3>Exercise ${i+1}</h3>${btn('Remove','removeEx',`data-day="${esc(d.id)}" data-ex="${esc(e.id)}"`,'small danger ghost')}</div><label>Name<input data-pex="${esc(e.id)}" data-key="name" value="${esc(e.name)}" maxlength="100"></label><label style="margin-top:8px">Primary muscle<select data-pex="${esc(e.id)}" data-key="muscle">${groups.map(g=>`<option ${g===e.muscle?'selected':''}>${g}</option>`).join('')}</select></label><div class="inputgrid" style="margin-top:8px">${[['Working sets','sets',1,12,1],['Warm-up sets','warmups',0,5,1],['Min reps','low',1,100,1],['Max reps','high',1,100,1],['Target RIR','rir',0,5,1],['Rest (sec)','rest',15,900,1],['Load increment (kg)','step',0.1,100,0.1]].map(([label,k,min,max,step])=>`<label>${label}<input type="number" min="${min}" max="${max}" step="${step}" data-pex="${esc(e.id)}" data-key="${k}" value="${e[k]}"></label>`).join('')}</div><div class="actions" style="margin-top:10px">${btn('↑ Move','moveEx',`data-day="${esc(d.id)}" data-ex="${esc(e.id)}" data-dir="-1" ${i===0?'disabled':''}`,'small ghost')}${btn('↓ Move','moveEx',`data-day="${esc(d.id)}" data-ex="${esc(e.id)}" data-dir="1" ${i===d.exercises.length-1?'disabled':''}`,'small ghost')}</div></div>`).join('')}<div class="stack">${btn('+ Add exercise','newEx',`data-day="${esc(d.id)}"`,'full')}${btn('Remove workout','removeDay',`data-id="${esc(d.i function history(){const sessions=sorted();return top('TRAINING RECORD','History','Your real sessions, in reverse chronological order.')+(sessions.length?sessions.map(s=>{const n=s.exercises.reduce((a,e)=>a+work(e).length,0);return `<details><summary><div><h3>${esc(s.name)}</h3><span class="hint">${dateText(s.finished)} · ${n} working sets</span></div></summary><div class="inside">${s.exercises.filter(e=>e.rows.some(r=>r.done)).map(e=>`<div class="line"><h3>${esc(e.name)}</h3>${e.rows.filter(x=>x.done).map(x=>`<div class="row" style="font-size:13px"><span>${x.warm?'Warm-up':'Working set'}</span><span>${x.kg} kg × ${x.reps}${x.warm?'':` · RIR ${x.rir===5?'5+':x.rir}`}</span></div>`).join('')}</div>`).join('')}<div class="actions">${btn('Correct workout','editSession',`data-id="${esc(s.id)}" ${state.active?'disabled':''}`,'small ghost')}${btn('Delete','deleteSession',`data-id="${esc(s.id)}"`,'small danger ghost')}</div></div></details>`}).join(''):'<div class="empty section">No workouts yet.<br>Finish your first session to build your history.</div>')}
function progress(){const all=new Map();for(const s of sorted())for(const e of s.exercises)if(work(e).length&&!all.has(e.id))all.set(e.id,e);const seven=state.sessions.filter(s=>Date.parse(s.finished)>=Date.now()-7*864e5);const counts=Object.fromEntries(groups.map(g=>[g,0]));for(const s of seven)for(const e of s.exercises)counts[e.muscle]+=work(e).length;const id=all.has(progressId)?progressId:all.keys().next().value;let html=top('PERFORMANCE','Progress','Compare sessions at similar effort, not just heavier weights.');if(id){const e=all.get(id);const data=sorted().filter(s=>s.exercises.some(e=>e.id===id&&work(e).length)).slice(0,12).reverse().map(s=>{const ex=s.exercises.find(e=>e.id===id),r=work(ex);return {s,ex,kg:Math.max(...r.map(x=>x.kg)),reps:r.reduce((a,x)=>a+x.reps,0),r}});const max=Math.max(1,...data.map(x=>x.kg)),min=0;const px=i=>32+i*270/Math.max(1,data.length-1),py=v=>118-v/max*90;html+=`<div class="panel"><label>Exercise<select id="progressSelect">${[...all].map(([k,v])=>`<option value="${esc(k)}" ${id===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label><div class="metricgrid section"><div class="metric"><span>Latest top load</span><strong>${data.at(-1).kg} kg</strong></div><div class="metric"><span>Latest total reps</span><strong>${data.at(-1).reps}</strong></div></div><h3>Top working load (kg)</h3><svg class="chart" viewBox="0 0 320 148" role="img" aria-label="Top working load trend"><path d="M32 28V118H307" fill="none" stroke="#444"/>${[0,.5,1].map(f=>`<line x1="32" x2="307" y1="${py(max*f)}" y2="${py(max*f)}" stroke="#333"/><text x="28" y="${py(max*f)+4}" text-anchor="end" fill="#a0a4a2" font-size="9">${Math.round(max*f*10)/10}</text>`).join('')}<polyline points="${data.map((d,i)=>`${px(i)},${py(d.kg)}`).join(' ')}" fill="none" stroke="#b8dfbc" stroke-width="2"/>${data.map((d,i)=>`<circle cx="${px(i)}" cy="${py(d.kg)}" r="3.5" fill="#b8dfbc"/>`).join('')}<text x="32" y="138" fill="#a0a4a2" font-size="10">${dateText(data[0].s.fini document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-act]');if(!b||b.disabled)return;const ds=b.dataset;const a=ds.act;const {e,r}=locate(ds);const d=state.days.find(x=>x.id===ds.day);if(a==='tab'){tab=ds.id;render();window.scrollTo(0,0);return}if(a==='choose'){selectedDay=ds.id;render();return}if(a==='start'){const day=state.days.find(x=>x.id===ds.id);if(state.active||!day?.exercises.length)return;state.active=makeSession(day);openEx=state.active.exercises[0]?.id;state.timer=null;save();render();window.scrollTo(0,0);return}if(a==='toggleSet'&&r){if(r.done){r.done=false}else{if(r.kg===null||!finite(r.kg)||r.kg<0||!Number.isInteger(r.reps)||r.reps<=0||!r.warm&&r.rir===null){toast('Enter weight, reps'+(r.warm?'':' and actual RIR'));return}r.done=true;if(!r.warm)startTimer(e);const next=e.rows.slice(e.rows.indexOf(r)+1).find(s=>s.warm===r.warm&&!s.done);if(next&&next.kg===null)next.kg=r.kg;}openEx=e.id;save();redrawKeep();return}if((a==='addWarm'||a==='addSet')&&e){if(e.rows.length>=30){toast('Maximum 30 sets per exercise');return}if(a==='addWarm')e.rows.splice(e.rows.findIndex(x=>!x.warm)<0?e.rows.length:e.rows.findIndex(x=>!x.warm),0,rowSet(true));else e.rows.push(rowSet(false,allWork(e).at(-1)?.kg??null));openEx=e.id;save();redrawKeep();return}if(a==='manualTimer'&&e){startTimer(e);return}if(a==='timerAdd'&&state.timer){state.timer.end=Math.max(Date.now(),state.timer.end)+30000;save();updateTimer();return}if(a==='timerStop'){state.timer=null;save();updateTimer();return}if(a==='finish'&&state.active){const s=state.active,total=s.exercises.reduce((n,e)=>n+allWork(e).length,0),done=s.exercises.reduce((n,e)=>n+work(e).length,0);if(!done){toast('Complete at least one working set first');return}if(done<total&&!confirm(`Save ${done} completed working sets out of ${total}? Incomplete sets will not count.`))return;s.finished=s.originalFinished||now();delete s.originalFinished;const index=state.sessions.findIndex(x=>x.id===s.id);if(index>=0)state.sessions[index]=s;else {state.sessions.push(s);state.lastDay=s.dayId}state.active=null;state.timer=null;const ix=state.days.findIndex(d=>d.id===state.lastDay);selectedDay=state.days[(ix+1)%state.days.length].id;save();tab='History';render();window.scrollTo(0,0);toast(storageOK?'Workout saved':'Workout retained in memory; export now');return}if(a==='discard'&&state.active){if(!confirm('Discard this in-progress workout or correction?'))return;state.active=null;state.timer=null;save();render();return}if(a==='editSession'){if(state.active)return;const s=state.sessions.find(s=>s.id===ds.id);if(!s)return;state.active=copy(s);state.active.originalFinished=s.finished;state.active.finished=null;openEx=state.active.exercises[0]?.id;state.timer=null;tab='Today';save();render();window.scrollTo(0,0);return}if(a==='deleteSession'){if(state.active?.id===ds.id){toast('Finish or discard the correction first');return}if(confirm('Delete this workout permanently?')){state.sessions=state.sessions.filter(s=>s.id!==ds.id);save();render()}return}if(a==='newDay'){const name=prompt('Workout name','Full body');if(!name?.trim())return;state.days.push({id:uid(),name:name.trim().slice(0,60),exercises:[]});save();redrawKeep();app.querySelectorAll('details[data-day]').item(state.days.length-1).open=true;return}if(a==='removeDay'){if(state.days.length<=1)return;if(confirm('Remove this workout template? Past records will stay.')){state.days=state.days.filter(x=>x.id!==ds.id);save();redrawKeep()}return}if(a==='newEx'&&d){const name=prompt('Exercise name');if(!name?.trim())return;d.exercises.push(exercise(name.trim().slice(0,100),'Other'));save();redrawKeep();return}if(a==='removeEx'&&d){if(confirm('Remove this exercise from the template? Past records will stay.')){d.exercises=d.exercises.filter(x=>x.id!==ds.ex);save();redrawKeep()}return}if(a==='moveEx'&&d){const i=d.exercises.findIndex(x=>x.id===ds.ex),j=i+Number(ds.dir);if(i>=0&&j>=0&&j<d.exercises.length){[d.exercises[i],d.exercises[j]]=[d.exercises[j],d.exercises[i]];save();redrawKeep()}return}if(a==='export')exportBackup();if(a==='csv')csv();if(a==='import')document.getElementById('importFile').click()});
document.getElementById('importFile').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(!validState(data))throw Error('Invalid FORM backup');if(!confirm(`Restore ${data.sessions.length} saved workouts and replace all current records? Export your current backup first if needed.`))return;state=data;loadFailed=false;selectedDay=state.days[0].id;openEx=null;save();tab='Today';render();toast(storageOK?'Backup restored':'Restored in memory only')}catch(e){toast('Invalid or unsupported backup file')}});

async function api(url,opts={}){if(!tokenOK())throw Error('Google access expired. Reconnect to upload pending changes.');const r=await fetch(url,{...opts,headers:{...opts.headers,Authorization:'Bearer '+accessToken}});if(r.status===401){accessToken=null;throw Error('Google access expired. Reconnect to upload pending changes.')}if(!r.ok)throw Error('Google Drive request failed ('+r.status+'). Your local records have not been discarded.');return r.json()}

function disconnect(){if(busy||connecting)return;if(profile.dirty&&!confirm('Pending records will remain on this device under your account. Sign out anyway?'))return;accessToken=null;expiresAt=0;account=null;profile={base:null,dirty:false};problem='';conflict=null;localStorage.removeItem(ACCOUNT_KEY);try{const raw=localStorage.getItem(KEY);state=raw?migrateState(JSON.parse(raw)):fresh()}catch(e){loadFailed=true;state=fresh()}persist();resetView();showCloud()}
function scheduleSync(){clearTimeout(syncTimer);if(tokenOK()&&!conflict&&navigator.onLine)syncTimer=setTimeout(()=>sync(),1800)}
async function snapshots(){let all=[],page='';do{const q=new URLSearchParams({q:"trashed = false and appProperties has { key='formKind' and value='snapshot' }",fields:'nextPageToken,files(id,name,createdTime,appProperties)',pageSize:'1000'});if(page)q.set('pageToken',page);const r=await api(DRIVE+'/files?'+q);all.push(...(r.files||[]));page=r.nextPageToken||''}while(page);const byId=new Map();for(const f of all){const id=f.appProperties?.snapshot;if(id)byId.set(id,f)}const parents=new Set();for(const f of byId.values())for(const [k,v] of Object.entries(f.appProperties||{}))if(/^p\d+$/.test(k))parents.add(v);return [...byId.values()].filter(f=>!parents.has(f.appProperties.snapshot)).sort((a,b)=>String(b.createdTime).localeCompare(String(a.createdTime)))}
async function readSnapshot(f){const data=await api(DRIVE+'/files/'+encodeURIComponent(f.id)+'?alt=media');if(data.snapshot!==f.appProperties.snapshot||data.format!==1)throw Error('Cloud data format not supported. No records overwritten.');return migrateState(data.state)}
async function snapshotFolder(){const q=new URLSearchParams({q:"trashed = false and mimeType = 'application/vnd.google-apps.folder' and appProperties has { key='formKind' and value='folder' }",fields:'files(id)',pageSize:'100'});const r=await api(DRIVE+'/files?'+q);if(r.files?.length)return r.files[0].id;const folder=await api(DRIVE+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'FORM Fitness',mimeType:'application/vnd.google-apps.folder',appProperties:{formKind:'folder'}})});return folder.id}
async function writeSnapshot(data,parents){if(parents.length>20)throw Error('Too many conflicting versions; recovery is required.');const id=uid(),props={formKind:'snapshot',snapshot:id};parents.forEach((v,i)=>props['p'+i]=v);const boundary='form_'+uid().replace(/[^a-zA-Z0-9]/g,'');const folder=await snapshotFolder();const meta={parents:[folder],name:'FORM snapshot '+now().replace(/[:.]/g,'-')+' '+id.slice(0,8)+'.json',mimeType:'application/json',appProperties:props};const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({format:1,snapshot:id,appVersion:RELEASE,savedAt:now(),state:data})+'\r\n--'+boundary+'--';await api(UPLOAD+'/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});return id}
async function sync(){if(staleTab||!account||busy||connecting||loadFailed||!tokenOK()||!navigator.onLine||conflict){paintCloud();return}busy=true;paintCloud();const initial=JSON.stringify(state);try{const heads=await snapshots(),head=heads[0],remote=head?.appProperties.snapshot||null;if(heads.length>1||(remote!==profile.base&&profile.dirty&&remote!==null)){conflict=heads;throw Error('Cloud and device versions differ. Both versions are preserved; choose a version in Google Drive settings.')}if(remote!==profile.base){if(!head)throw Error('Cloud snapshots are missing. Local data retained; reconnect after checking Drive.');const incoming=await readSnapshot(head);if(initial!==JSON.stringify(state)){conflict=heads;throw Error('A remote version arrived during local editing. Resolve the conflict before uploading.')}state=incoming;profile={base:remote,dirty:false};persist();resetView()}else if(profile.dirty||!remote){const sent=copy(state),text=JSON.stringify(sent);const id=await writeSnapshot(sent,remote?[remote]:[]);profile.base=id;profile.dirty=JSON.stringify(state)!==text;persist()}problem=''}catch(e){fail(e)}finally{busy=false;paintCloud();if(!cloudPanel.classList.contains('hidden'))showCloud();if(profile.dirty&&!problem)scheduleSync()}}
async function resolveConflict(useRemote){if(busy||!tokenOK()){toast('Reconnect Google first');return}if(!confirm(useRemote?'Use the latest cloud version? Other cloud versions remain as recovery snapshots. Local changes will also be archived.':'Keep this device version? Other cloud versions remain as recovery snapshots.'))return;busy=true;lockUI(true);try{const heads=await snapshots(),ids=heads.map(f=>f.appProperties.snapshot);if(!heads.length)throw Error('No cloud versions found');const local=copy(state);const chosen=useRemote?await readSnapshot(heads[0]):local;if(useRemote&&profile.dirty){const archived=await writeSnapshot(local,profile.base?[profile.base]:[]);ids.push(archived)}const id=await writeSnapshot(chosen,[...new Set(ids)]);state=chosen;profile={base:id,dirty:false};conflict=null;problem='';persist();resetView()}catch(e){fail(e)}finally{busy=false;lockUI(false);paintCloud();showCloud()}}
window.addEventListener('online',()=>{paintCloud();if(tokenOK())sync()});window.addEventListener('offline',paintCloud);window.addEventListener('focus',()=>{paintCloud();if(tokenOK()&&!state.active)sync()});setInterval(()=>{paintCloud();if(tokenOK()&&!state.active)sync()},45000);
window.addEventListener('storage',e=>{if(e.key===ACCOUNT_KEY||e.key===(account?PROFILE_PREFIX+account.id:KEY)){staleTab=true;lockUI(true);problem='Another FORM. tab changed your account or records. Reload this page before continuing.';paintCloud();cloudPanel.classList.remove('hidden');cloudPanel.textContent=problem;const reload=document.createElement('button');reload.textContent='Reload';reload.onclick=()=>location.reload();cloudPanel.append(reload)}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').then(reg=>{function offer(w){if(!w||!navigator.serviceWorker.controller)return;updateWorker=w;document.getElementById('updatePanel').classList.remove('hidden')}offer(reg.waiting);reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed')offer(w)})});document.getElementById('updateButton').onclick=()=>{if(state.active){toast('Finish your workout before updating');return}if(profile.dirty||busy||!storageOK){toast('Synchronise pending changes before updating');return}updateWorker?.postMessage({type:'SKIP_WAITING'})};navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updateWorker)location.reload()})}).catch(()=>{})}
setInterval(updateTimer,500);persist();render();paintCloud();
})();
</script></body></html>
